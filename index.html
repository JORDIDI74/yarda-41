:root[data-theme="dark"]{
  --verde-t:#0F2E1C; --coral-t:#3A1620; --azul-t:#0F2740; --viol-t:#291640; --ambar-t:#3A2A0C;
  --ink:#EEF7F1; --ink2:#C2D3C8; --mut:#8A9C90;
  --line:#22382B; --line2:#2F4A3A;
  --surf:#15251C; --surf2:#1A2D22; --ground:#0D1912;
  --lock:#22382B; --lock-d:#182A20;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.disp,button,.num{font-family:"Baloo 2",Nunito,-apple-system,sans-serif;font-weight:800;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-size:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ SHELL ============ */
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--ground);position:relative;
     display:flex;flex-direction:column}
.scroll{flex:1;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.pad{padding-top:14px}
.hud{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:2px solid var(--line);
     padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px}
.hud .chip{display:flex;align-items:center;gap:5px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:16px}
.hud .spacer{flex:1}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;font-family:Nunito,sans-serif;white-space:nowrap}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.tabs-in{width:100%;max-width:520px;background:var(--surf);border-top:2px solid var(--line);
     display:grid;grid-template-columns:repeat(5,1fr);pointer-events:auto;
     padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;
     cursor:pointer;border-radius:14px;font-size:10.5px;font-family:Nunito,sans-serif;font-weight:800;color:var(--mut);letter-spacing:.02em}
.tab svg{width:24px;height:24px;stroke-width:2.3;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--verde-d);background:var(--verde-t)}

/* ============ BOTONES ============ */
.b{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:800;
   cursor:pointer;transition:transform .06s,box-shadow .06s;text-align:center;font-family:"Baloo 2",Nunito,sans-serif;letter-spacing:.01em}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:none!important}
.b:disabled{opacity:.45;cursor:not-allowed}
.b-verde{background:var(--verde);color:#fff;box-shadow:var(--sh) var(--verde-d)}
.b-viol{background:var(--viol);color:#fff;box-shadow:var(--sh) var(--viol-d)}
.b-azul{background:var(--azul);color:#04203a;box-shadow:var(--sh) var(--azul-d)}
.b-coral{background:var(--coral);color:#fff;box-shadow:var(--sh) var(--coral-d)}
.b-ambar{background:var(--ambar);color:#3a2100;box-shadow:var(--sh) var(--ambar-d)}
.b-ghost{background:var(--surf);color:var(--ink2);border:2px solid var(--line2);box-shadow:var(--sh) var(--line2)}
.b-sm{padding:11px 14px;font-size:15px;border-radius:13px}

/* ============ TARJETAS ============ */
.card{background:var(--surf);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-family:Nunito,sans-serif}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
hr.sep{border:0;border-top:2px solid var(--line);margin:14px 0}
.stat{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .k{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-family:Nunito,sans-serif}
.stat .v{font-size:23px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;line-height:1.15;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:800;font-family:Nunito,sans-serif}
.srcnote{font-size:11.5px;color:var(--mut);line-height:1.5;padding:12px 2px 4px}
.srcnote a{color:inherit}

/* mascota */
.coach{display:flex;gap:10px;align-items:flex-end;margin:4px 0 14px}
.coach .av{flex:0 0 58px;height:58px;border-radius:50%;background:var(--verde);display:grid;place-items:center;font-size:32px;
     box-shadow:0 4px 0 var(--verde-d)}
.coach .bub{flex:1;background:var(--surf);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:11px 14px;
     font-weight:700;font-size:15px;line-height:1.4}
.coach .bub b{color:var(--verde-d)}

/* ============ RUTA ============ */
.unitband{border-radius:var(--r);padding:14px 16px;margin:16px 0 6px;color:#fff;position:relative;overflow:hidden}
.unitband h3{font-size:20px;color:#fff}
.unitband .eyebrow{color:rgba(255,255,255,.85)}
.unitband .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
.unitband .bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.node{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.node:active .disc{transform:translateY(5px);box-shadow:none}
.node .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;
      box-shadow:0 6px 0 var(--dd);background:var(--cc);transition:transform .08s,box-shadow .08s;position:relative}
.node .lbl{font-size:12px;font-weight:800;color:var(--ink2);max-width:150px;text-align:center;line-height:1.25}
.node.pend .disc{background:var(--lock);box-shadow:0 6px 0 var(--lock-d)}
.node .crown{position:absolute;top:-11px;right:-6px;font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.node .chk{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:var(--surf);
      border:2px solid var(--line);border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px;font-family:Nunito,sans-serif;white-space:nowrap;color:var(--ink2)}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 6px 0 var(--dd),0 0 0 0 rgba(0,177,64,.5)}50%{box-shadow:0 6px 0 var(--dd),0 0 0 13px rgba(0,177,64,0)}}

/* ============ LECCIÓN ============ */
#lesson,#deck,#kick{position:fixed;inset:0;z-index:90;background:var(--ground);display:none;flex-direction:column}
#deck{z-index:92} #kick{z-index:94;background:#07130c}
#lesson.on,#deck.on,#kick.on{display:flex}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;max-width:520px;margin:0 auto;width:100%}
.xbtn{background:none;border:0;font-size:28px;color:var(--mut);cursor:pointer;line-height:1;padding:0 4px;font-weight:700}
/* el progreso es un drive: el balón avanza hacia la end zone */
.drive{flex:1;height:22px;border-radius:8px;position:relative;overflow:visible;
   background:repeating-linear-gradient(90deg,var(--cesped) 0 10%,var(--cesped2) 10% 20%);border:2px solid rgba(255,255,255,.0)}
.drive::before{content:"";position:absolute;inset:0;border-radius:8px;
   background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.55) calc(10% - 1px) 10%)}
.drive .ez{position:absolute;right:0;top:0;bottom:0;width:10%;border-radius:0 8px 8px 0;background:var(--ezc,#046A38);
   display:grid;place-items:center;font-size:8px;color:#fff;font-weight:800}
.drive .ball{position:absolute;top:50%;font-size:20px;line-height:1;transform:translate(-50%,-52%);
   transition:left .5s cubic-bezier(.34,1.4,.64,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));font-style:normal}
.lbody{flex:1;overflow-y:auto;padding:10px 16px 250px;max-width:520px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.qtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
      padding:4px 9px;border-radius:99px;margin-bottom:10px;font-family:Nunito,sans-serif}
.qtext{font-size:19.5px;font-weight:700;line-height:1.4;margin:0 0 16px;font-family:Nunito,sans-serif}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--surf);
     border:2px solid var(--line2);border-bottom-width:4px;border-radius:15px;padding:13px 14px;margin-bottom:10px;
     cursor:pointer;font-size:16px;font-weight:700;font-family:Nunito,sans-serif;line-height:1.4;color:var(--ink);transition:background .12s,border-color .12s}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:12px}
.opt kbd{flex:0 0 25px;height:25px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;
     font-size:12px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;background:transparent;color:var(--mut);margin-top:1px}
.opt.ok{background:var(--verde-t);border-color:var(--verde);color:var(--verde-d)}
.opt.ok kbd{border-color:var(--verde);color:var(--verde-d)}
.opt.ko{background:var(--coral-t);border-color:var(--coral);color:var(--coral-d)}
.opt.ko kbd{border-color:var(--coral);color:var(--coral-d)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;text-align:center;font-family:"Baloo 2",Nunito,sans-serif;font-size:18px;padding:18px 10px}
.vf .opt kbd{display:none}
/* parejas */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pares .col{display:flex;flex-direction:column;gap:9px}
.par{background:var(--surf);border:2px solid var(--line2);border-bottom-width:4px;border-radius:14px;padding:10px 9px;min-height:58px;
     font-family:Nunito,sans-serif;font-weight:800;font-size:13.5px;line-height:1.25;cursor:pointer;color:var(--ink);display:grid;place-items:center;text-align:center}
.par.sel{background:var(--azul-t);border-color:var(--azul);color:var(--azul-d)}
.par.ok{background:var(--verde-t);border-color:var(--verde);color:var(--verde-d);opacity:.6;cursor:default}
.par.ko{background:var(--coral-t);border-color:var(--coral);color:var(--coral-d);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.lfoot,.dfoot{position:fixed;bottom:0;left:0;right:0;z-index:95;display:flex;justify-content:center}
.lfoot-in,.dfoot-in{width:100%;max-width:520px;background:var(--surf);border-top:2px solid var(--line);
     padding:14px 16px calc(16px + env(safe-area-inset-bottom));transition:background .22s,border-color .22s}
.lfoot-in:empty{display:none}
.dfoot-in{display:flex;gap:10px}
.sheet.up{animation:sup .3s cubic-bezier(.2,1.1,.4,1)}
@keyframes sup{from{transform:translateY(34px);opacity:.35}to{transform:none;opacity:1}}
.sheet.ok{background:var(--verde-t);border-top-color:var(--verde)}
.sheet.ko{background:var(--coral-t);border-top-color:var(--coral)}
.fbtitle{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800}
.fbline{font-size:14.5px;line-height:1.5;margin:7px 0;font-family:Nunito,sans-serif}
.fbline b{font-weight:800}
.fbscroll{max-height:40vh;overflow-y:auto;margin-bottom:12px;overscroll-behavior:contain}
.tms{display:flex;gap:4px}
.tms i{width:22px;height:22px;border-radius:7px;background:var(--ambar);display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:800;color:#3a2100;font-family:"Baloo 2",Nunito,sans-serif}
.tms i.off{background:var(--line);color:var(--mut)}

/* ============ TEORÍA ============ */
.dots{flex:1;display:flex;gap:5px;align-items:center}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--verde)}
.skip{background:none;border:0;color:var(--mut);font-family:Nunito,sans-serif;font-weight:800;font-size:13px;cursor:pointer;padding:4px}
.dbody{flex:1;overflow-y:auto;padding:6px 16px 130px;max-width:520px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.tcard{background:var(--surf);border:2px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 4px 0 var(--line)}
.tcard h3{font-size:23px;margin:0 0 12px;line-height:1.2}
.tcard p{font-size:15.5px;line-height:1.55;margin:12px 0 0;font-family:Nunito,sans-serif;font-weight:600;color:var(--ink2)}
.tcard p b{color:var(--ink);font-weight:800}
.tkey{background:var(--verde-t);color:var(--verde-d);border-radius:15px;padding:14px 16px;font-family:"Baloo 2",Nunito,sans-serif;
      font-weight:800;font-size:19px;line-height:1.3;text-align:center;margin-top:10px}
.tvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tvs>div{border-radius:15px;padding:13px 12px;border:2px solid}
.tvs h4{font-size:15.5px;margin:0 0 8px}
.tvs ul{margin:0;padding-left:16px;font-size:13.5px;line-height:1.45;font-weight:700;font-family:Nunito,sans-serif}
.tvs li{margin-bottom:5px}
.tflow{display:flex;flex-direction:column;gap:0}
.tflow div{display:flex;align-items:flex-start;gap:11px;font-size:14.5px;font-weight:700;font-family:Nunito,sans-serif;line-height:1.45}
.tflow b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;
     font-family:"Baloo 2",Nunito,sans-serif;font-size:14px}
.tflow span.ar{flex:0 0 26px;text-align:center;color:var(--line2);font-size:17px;line-height:1;padding:3px 0}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tlist div{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;font-weight:700;font-family:Nunito,sans-serif;line-height:1.4;
     background:var(--surf2);border-radius:12px;padding:10px 12px;border:2px solid var(--line)}
.tlist em{font-style:normal;flex:0 0 auto;font-size:17px;line-height:1.3}

/* ============ VISUALES ============ */
.vis{margin:0 0 14px}
.vis svg{width:100%;height:auto;display:block;border-radius:12px}
.vis .cap{font-size:12.5px;font-weight:800;color:var(--mut);text-align:center;margin-top:6px;font-family:Nunito,sans-serif}
.refbox{background:var(--surf2);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;justify-content:center;gap:8px}
.refbox svg{width:auto;height:150px;border-radius:0}
.refbox.duo svg{height:128px}
.marc{background:#0B0F0D;border-radius:14px;padding:12px 14px;color:#fff;font-family:ui-monospace,"SF Mono",Menlo,monospace;border:3px solid #2a332e}
.marc .sc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.04em}
.marc .sc b{font-size:28px;color:#FFD028;font-variant-numeric:tabular-nums}
.marc .dn{text-align:center;font-size:30px;font-weight:800;color:#FFD028;letter-spacing:.03em;line-height:1.15}
.marc .sub{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:#9fb3a6;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.marc .sc+.dn,.marc .sc+.sub{margin-top:6px;border-top:1px solid #2a332e;padding-top:6px}

/* ============ KICKER ============ */
.khead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;max-width:520px;margin:0 auto;width:100%;color:#fff}
.khead .xbtn{color:#9fb3a6}
.khead .ttl{flex:1;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:17px;line-height:1.15}
.khead .ttl small{display:block;font-family:Nunito,sans-serif;font-size:12px;color:#9fb3a6;font-weight:700}
.kbody{flex:1;max-width:520px;margin:0 auto;width:100%;padding:0 12px;display:flex;flex-direction:column;min-height:0}
#kscene{width:100%;flex:1;min-height:0;display:block}
.kpanel{padding:10px 4px calc(16px + env(safe-area-inset-bottom));color:#fff}
.kmsg{text-align:center;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:18px;line-height:1.2;min-height:44px;margin-bottom:6px;display:grid;place-items:center}
.kbar{height:30px;border-radius:99px;background:#22332a;position:relative;overflow:hidden;margin-bottom:10px;border:2px solid #34493d}
.kbar .zone{position:absolute;top:0;bottom:0;background:var(--verde);opacity:.9}
.kbar .mk{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
.kbar .lbl{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.75);text-transform:uppercase;font-family:Nunito,sans-serif;pointer-events:none}
.kbar.dim{opacity:.35}
.klives{display:flex;gap:4px;font-size:15px}

/* ============ VARIOS ============ */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99;width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--surf);
   padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;font-family:Nunito,sans-serif;display:none;max-width:88vw;text-align:center}
.tog{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:13px;margin-bottom:12px}
.tog button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12.5px;font-weight:800;
     font-family:Nunito,sans-serif;cursor:pointer;color:var(--mut)}
.tog button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=text],input[type=search]{width:100%;padding:13px 14px;border:2px solid var(--line2);border-radius:13px;background:var(--surf);
     color:var(--ink);font-family:Nunito,sans-serif;font-weight:700;font-size:17px;-webkit-appearance:none;appearance:none}
.fade{animation:fi .32s ease}
@keyframes fi{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pop{animation:po .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes po{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.ring{display:block;margin:0 auto}
.gl{display:flex;flex-direction:column;gap:8px}
.gl>div{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:10px 13px}
.gl b{font-family:"Baloo 2",Nunito,sans-serif;font-size:16.5px}
.gl span{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.4}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig>div{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:10px 8px 12px;text-align:center}
.sig svg{height:118px;width:auto}
.sig b{display:block;font-family:"Baloo 2",Nunito,sans-serif;font-size:15.5px;line-height:1.15;margin-top:4px}
.sig span{display:block;font-size:12px;font-weight:700;color:var(--mut);line-height:1.3;margin-top:3px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ins>div{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;font-weight:800;line-height:1.25}
.ins>div i{display:block;font-size:28px;font-style:normal;margin-bottom:3px}
.ins>div.no{opacity:.38;filter:grayscale(1)}

function fechaLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return fechaLocal(new Date())}
function ayer(){const d=new Date();d.setDate(d.getDate()-1);return fechaLocal(d)}
function sumar(yd){
  if(S.hoyDia!==hoy()){S.hoyDia=hoy();S.hoyYd=0}
  S.yd+=yd; S.hoyYd+=yd;
}
function marcarDia(){
  const h=hoy(); if(S.ult===h)return;
  S.racha=(S.ult===ayer())?S.racha+1:1; S.ult=h; S.dias++;
}
const RANGOS=[[0,'Novato'],[100,'Walk-on'],[300,'Redshirt'],[600,'Suplente'],[1000,'Titular'],[1500,'Capitán'],[2200,'All-American'],[3000,'Leyenda del Herd']];

}

let AC=null;
function tono(f,d,tipo,vol,cuando){
  if(!S.snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(cuando||0);
    o.type=tipo||'sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}

  if(o.to!=null) s+=`<line x1="${FX(o.to)}" y1="0" x2="${FX(o.to)}" y2="150" stroke="#FFD028" stroke-width="3"/>`;

function refSVG(k){
  const p=POSE[k]; if(!p)return '';
  const brazo=(sh,pts)=>{const d=`M${sh[0]} ${sh[1]} L${pts[0][0]} ${pts[0][1]} L${pts[1][0]} ${pts[1][1]}`;
    return `<path d="${d}" stroke="#15171A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="4.5 4.5"/>
      <circle cx="${pts[1][0]}" cy="${pts[1][1]}" r="${p.big?7:5.6}" fill="#F2C9A0" stroke="#15171A" stroke-width="1.5"/>`};
  let s=`<svg viewBox="0 0 120 170" role="img" aria-label="Árbitro: ${esc(SENALES[k].g)}">`;
  // piernas y zapatillas
  s+='<path d="M51 112 L49 152 M69 112 L71 152" stroke="#15171A" stroke-width="12" stroke-linecap="round"/><path d="M42 156 h14 M64 156 h14" stroke="#15171A" stroke-width="7" stroke-linecap="round"/>';
  // torso a rayas
  s+='<defs><clipPath id="tor-'+k+'"><rect x="43" y="56" width="34" height="60" rx="9"/></clipPath></defs>';
  s+=`<g clip-path="url(#tor-${k})"><rect x="43" y="56" width="34" height="60" fill="#fff"/>`;
  for(let x=43;x<77;x+=9) s+=`<rect x="${x}" y="56" width="4.5" height="60" fill="#15171A"/>`;
  s+='</g><rect x="43" y="56" width="34" height="60" rx="9" fill="none" stroke="#15171A" stroke-width="1.5"/>';
  // cabeza y gorra blanca
  s+='<circle cx="60" cy="42" r="11.5" fill="#F2C9A0" stroke="#15171A" stroke-width="1.5"/>';
  s+='<path d="M48.5 39 a11.5 11.5 0 0 1 23 0 z" fill="#fff" stroke="#15171A" stroke-width="1.5"/><path d="M60 39.5 h15" stroke="#15171A" stroke-width="2.6" stroke-linecap="round"/>';
  s+=brazo([45,62],p.L)+brazo([75,62],p.R);
  if(p.x) s+=p.x;
  return s+'</svg>';
}
function vis(v){
  if(!v)return '';
  if(v.k==='campo')return svgCampo(v);
  if(v.k==='fg')return svgFG(v);
  if(v.k==='postes')return svgPostes();
  if(v.k==='marc')return htmlMarc(v);
  if(v.k==='ref')return `<div class="vis"><div class="refbox">${refSVG(v.s)}</div><div class="cap">${esc(SENALES[v.s].g)}</div></div>`;
  if(v.k==='refs')return `<div class="vis"><div class="refbox duo">${v.s.map(refSVG).join('')}</div></div>`;
  return '';
}

function openL(qs,modo,meta){
  if(!qs.length){toast('No hay jugadas disponibles');return}
  L={cola:qs.map(q=>({q,rep:0})),tot:qs.length,hechas:0,ok1:0,fallos:0,modo,meta:meta||{},tm:3,yd:0,t0:Date.now(),fase:'q',perdido:false};

function pintaCabecera(){
  const pct=L.hechas/L.tot;
  $('#lball').style.left=(4+pct*90)+'%';
  $('#lright').innerHTML=(L.modo==='jefe'||L.modo==='bowl')
    ?`<div class="tms" title="Tiempos muertos">${[0,1,2].map(i=>`<i class="${i<L.tm?'':'off'}">T</i>`).join('')}</div>`
    :`<span class="pill" style="background:var(--verde-t);color:var(--verde-d)">${L.hechas}/${L.tot}</span>`;
}
function paint(){
  const cur=L.cola[0], q=cur.q, t=TEMA[q.t], u=UNIT[t.u];
  L.fase='q'; pintaCabecera();
  let cuerpo;
  if(q.par){
    L.par={izq:baraja(q.par.map((p,i)=>i)),der:baraja(q.par.map((p,i)=>i)),sel:null,hechos:0,err:0};
    cuerpo=`<div class="pares"><div class="col">${L.par.izq.map(i=>`<button class="par" data-l="${i}" onclick="pickPar('l',${i},this)">${esc(q.par[i][0])}</button>`).join('')}</div>
      <div class="col">${L.par.der.map(i=>`<button class="par" data-r="${i}" onclick="pickPar('r',${i},this)">${esc(q.par[i][1])}</button>`).join('')}</div></div>`;
  } else if(q.vf){
    L.perm=[0,1];
    cuerpo=`<div class="vf" id="opts">${VF.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span>${i?'✗':'✓'} ${o}</span></button>`).join('')}</div>`;
  } else {
    L.perm=baraja(q.o.map((_,i)=>i));
    cuerpo=`<div id="opts">${L.perm.map((oi,i)=>`<button class="opt" onclick="pick(${i})"><kbd>${'ABCD'[i]}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;

    ${vis(q.v)}<p class="qtext">${md(q.q)}</p>${cuerpo}</div>`;
  $('#lbody').scrollTop=0;
  const sh=$('#sheet'); sh.className='lfoot-in sheet'; sh.innerHTML='';
}
function pick(i){
  if(!L||L.fase!=='q')return;
  const q=L.cola[0].q, orig=L.perm[i], ok=orig===q.r;
  [...$('#opts').children].forEach((b,j)=>{b.disabled=true; if(L.perm[j]===q.r)b.classList.add('ok'); else if(j===i)b.classList.add('ko')});
  resolver(ok, ok?null:(q.vf?VF[q.r]:q.o[q.r]));
}
function pickPar(lado,i,el){
  if(!L||L.fase!=='q'||el.classList.contains('ok'))return;
  const P=L.par, q=L.cola[0].q;
  if(!P.sel||P.sel.lado===lado){
    document.querySelectorAll('.par.sel').forEach(x=>x.classList.remove('sel'));
    P.sel={lado,i,el}; el.classList.add('sel'); SND.tap(); return;
  }
  const a=P.sel; P.sel=null; a.el.classList.remove('sel');
  if(a.i===i){ a.el.classList.add('ok'); el.classList.add('ok'); P.hechos++; SND.tap();
    if(P.hechos===q.par.length) resolver(P.err<=1,null);
  } else { P.err++; [a.el,el].forEach(x=>{x.classList.add('ko');setTimeout(()=>x.classList.remove('ko'),350)}); SND.ko(); }
}
function resolver(ok,correcta){
  const cur=L.cola[0], q=cur.q; L.fase='fb';
  S.tot++; if(ok)S.ok++;
  let gan=0, extra='';
  if(ok){
    gan=cur.rep?5:10; if(!cur.rep)L.ok1++;
    L.hechas++; L.yd+=gan; sumar(gan);
    S.fallos=S.fallos.filter(id=>id!==q._id);
    SND.ok();
  } else {
    L.fallos++; if(!S.fallos.includes(q._id))S.fallos.push(q._id);
    SND.ko();
    if(L.modo==='jefe'||L.modo==='bowl'){
      L.hechas++;
      if(L.tm>0){L.tm--; extra=`<div class="fbline" style="background:var(--ambar);color:#3a2100;border-radius:11px;padding:9px 11px"><b>⏸ Tiempo muerto gastado.</b> Te ${L.tm===1?'queda 1':'quedan '+L.tm}.</div>`}
      else L.perdido=true;
    }
  }
  save(); pintaCabecera();
  const ult=L.perdido||(L.cola.length===1&&(ok||L.modo==='jefe'||L.modo==='bowl'||cur.rep>=2));
  const sh=$('#sheet'); sh.className='lfoot-in sheet up '+(ok?'ok':'ko');
  sh.innerHTML=`<div class="fbscroll">
    <div class="fbtitle" style="color:var(--${ok?'verde':'coral'}-d)">${ok?(q.par?'✅ ¡Todas en su sitio!':'✅ ¡Primer down!'):(q.par?'🟨 Demasiados cambios':'🟨 Pañuelo: no era esa')}
      ${ok?`<span class="badge" style="background:var(--verde);color:#fff">+${gan} yardas</span>`:''}</div>
    ${correcta?`<div class="fbline"><b>✅ La buena:</b> ${esc(correcta)}</div>`:''}${extra}
    ${q.w?`<div class="fbline"><b>🎯 Por qué:</b> ${md(q.w)}</div>`:''}
    ${q.k?`<div class="fbline"><b>🧠 Quédate con esto:</b> ${md(q.k)}</div>`:''}
   </div>
   <button class="b b-${ok?'verde':'coral'}" onclick="siguiente(${ok?1:0})">${ult?'Ver resultado':'Siguiente'}</button>`;
}
function siguiente(ok){
  if(!L)return;
  if(L.perdido){finLec();return}
  const cur=L.cola.shift();
  if(!ok&&(L.modo==='lec'||L.modo==='repaso')){
    if(cur.rep<2){cur.rep++;L.cola.push(cur)} else L.hechas++;      // tras dos repeticiones se deja pasar
  }
  if(!L.cola.length)finLec(); else paint();
}

  } else { tit='Derrota en el último cuarto'; emo='😤'; sub='Te quedaste sin tiempos muertos. Repasa y vuelve a por la revancha.'; }
  sumar(bonus); L.yd+=bonus;
  const nuevas=chkInsig(); save();
  $('#lball').style.left=(gana?97:4+L.hechas/L.tot*90)+'%'; $('#lright').innerHTML=''; $('#lteo').style.display='none';
  $('#lbody').innerHTML=`<div class="pop" style="text-align:center;padding:22px 0 10px">
    <div style="font-size:66px">${emo}</div>
    <h2 style="font-size:30px;margin:8px 0 3px">${tit}</h2>
    <p class="mut" style="font-weight:700;margin:0 0 16px">${sub}</p>
    <div class="grid3" style="margin-bottom:14px">
      <div class="stat"><div class="k">Yardas</div><div class="v">+${L.yd}</div></div>
      <div class="stat"><div class="k">Acierto</div><div class="v">${pc}%</div></div>
      <div class="stat"><div class="k">Racha</div><div class="v">🔥${S.racha}</div></div>
    </div>
    ${L.modo==='lec'&&L.fallos===0?'<div class="card" style="border-color:var(--azul);background:var(--azul-t)"><b style="color:var(--azul-d)">💎 Drive perfecto: ni un pañuelo.</b></div>':''}
    ${nuevas.length?`<div class="card" style="border-color:var(--oro)"><div class="eyebrow">Insignia conseguida</div>${nuevas.map(i=>`<div style="font-size:36px;margin-top:5px">${i.e}</div><b>${esc(i.n)}</b>`).join('')}</div>`:''}
    ${L.modo==='lec'?coach('Después de un touchdown, toca <b>punto extra</b>. ¿Lo chutas tú?'):''}
  </div>`;
  const sh=$('#sheet'); sh.className='lfoot-in sheet up '+(gana?'ok':'');
  if(L.modo==='lec') sh.innerHTML=`<button class="b b-verde" style="margin-bottom:10px" onclick="patTrasLeccion()">👟 Chutar el punto extra</button><button class="b b-ghost b-sm" onclick="quitLesson()">Ahora no</button>`;
  else if(!gana) sh.innerHTML=`<div class="grid2"><button class="b b-ghost" onclick="quitLesson()">Salir</button><button class="b b-coral" onclick="revancha()">Revancha</button></div>`;
  else sh.innerHTML=`<button class="b b-verde" onclick="quitLesson();${L.modo==='bowl'?"go('yo')":''}">${L.modo==='bowl'?'Ver mi diploma':'Continuar'}</button>`;
  if(gana){SND.td();burst(true)}
}
function revancha(){const m=L.modo,u=L.meta.u;L.fin=true;quitLesson();if(m==='bowl')bowl();else jefeUnidad(u)}
function patTrasLeccion(){L.fin=true;quitLesson();openKick('pat')}
function verTeoria(){if(L&&L.meta.tema)showDeck(L.meta.tema)}

/* ================= MINIJUEGO DEL KICKER ================= */
let K=null, KRAF=0;
const KDIST=[20,25,30,32,35,40,45,50,54,57,60,63,66,70];
function openKick(modo){
  cancelAnimationFrame(KRAF);
  K={modo,idx:0,dist:20,fallos:0,hechos:0,mejor:0,fase:'dir',t0:performance.now(),dir:0,pow:0};
  $('#kick').classList.add('on'); document.body.style.overflow='hidden';
  nuevoChut();
  KRAF=requestAnimationFrame(loopKick);
}
function closeKick(){
  if(!K)return; cancelAnimationFrame(KRAF);
  K=null;
  $('#kick').classList.remove('on'); document.body.style.overflow='';
  chkInsig(); save(); render();
}
function kTol(d){return 1/(0.8+d/22)}            // media anchura de la zona buena de dirección (0–1)
function kReq(d){return Math.min(.965,0.30+d*0.0095)}   // potencia mínima (0–1)
function kPer(d){return Math.max(650,1900-d*17)}  // ms por barrido
function nuevoChut(){
  K.dist=K.modo==='pat'?20:KDIST[Math.min(K.idx,KDIST.length-1)];
  K.fase='dir'; K.t0=performance.now();
  const d=K.dist;
  $('#kttl').innerHTML=K.modo==='pat'?'Punto extra<small>Chut de 20 yardas · vale 1 punto</small>'
    :`Field goal de ${d} yardas<small>${d===32?'Como el que ganó a Gardner-Webb':d===54?'El más largo de Jorge Jr.':d>54?'Más lejos que el 41':'Balón en la yarda '+(d-17)+' rival'}</small>`;
  $('#klives').innerHTML=K.modo==='pat'?'':[0,1,2].map(i=>i<3-K.fallos?'🏈':'<span style="opacity:.25">🏈</span>').join('');
  $('#kzdir').style.left=(50-kTol(d)*50)+'%'; $('#kzdir').style.width=(kTol(d)*100)+'%';
  $('#kzpow').style.left=(kReq(d)*100)+'%'; $('#kzpow').style.width=((1-kReq(d))*100)+'%';
  $('#kbdir').classList.remove('dim'); $('#kbpow').classList.add('dim');
  $('#kmkpow').style.left='0%';
  $('#kmsg').textContent='1 · Dirección: toca en el verde';
  $('#kbtn').textContent='APUNTAR'; $('#kbtn').className='b b-ambar'; $('#kbtn').onclick=tapKick; $('#kbtn2').style.display='none';
  pintaEscena(0,null);
}
function onda(t,per){const u=(t%(per*2))/per; return u<1?u:2-u}     // 0→1→0, triangular
function loopKick(now){
  if(!K)return;
  if(K.fase==='dir'){ K.dir=onda(now-K.t0,kPer(K.dist))*2-1; $('#kmkdir').style.left=(50+K.dir*50)+'%'; }
  else if(K.fase==='pow'){ K.pow=onda(now-K.t0,kPer(K.dist)*.8); $('#kmkpow').style.left=(K.pow*100)+'%'; }
  else if(K.fase==='fly'){ const u=Math.min(1,(now-K.t0)/1250); pintaEscena(u,K.res); if(u>=1)finChut(); }
  KRAF=requestAnimationFrame(loopKick);
}
function tapKick(){
  if(!K)return;
  if(K.fase==='dir'){
    K.fase='pow'; K.t0=performance.now(); SND.tap();
    $('#kbdir').classList.add('dim'); $('#kbpow').classList.remove('dim');
    $('#kmsg').textContent='2 · Potencia: toca en el verde';
    $('#kbtn').textContent='¡CHUTAR!'; $('#kbtn').className='b b-verde';
  } else if(K.fase==='pow'){
    const d=K.dist, off=K.dir/kTol(d), fuerza=K.pow>=kReq(d);
    let tipo;
    if(!fuerza) tipo='corto'; else if(Math.abs(off)<1) tipo='bueno'; else if(Math.abs(off)<1.14) tipo='poste'; else tipo='fuera';
    K.res={off:tipo==='poste'?Math.sign(off):Math.max(-2.4,Math.min(2.4,off)),tipo};
    K.fase='fly'; K.t0=performance.now(); SND.kick();
    $('#kmsg').textContent='…'; $('#kbtn').disabled=true;
  }
}
function pintaEscena(u,res){
  // escena en vertical (360 × 520): cielo de noche, grada, postes y césped
  const d=K.dist, hw=Math.max(15,52-d*0.5), cy=205, cx=180, alto=hw*2.2, y0=468;
  let s='<defs><linearGradient id="kc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040910"/><stop offset="1" stop-color="#12314A"/></linearGradient>'+
        '<radialGradient id="kf" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="#cfe6ff" stop-opacity=".45"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/></radialGradient>'+
        '<linearGradient id="kg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14592F"/><stop offset="1" stop-color="#21904F"/></linearGradient></defs>';
  s+='<rect width="360" height="520" fill="url(#kc)"/>';
  [[66,58],[294,58]].forEach(([x,y])=>{s+=`<line x1="${x}" y1="${y+6}" x2="${x}" y2="250" stroke="#22303d" stroke-width="4"/><circle cx="${x}" cy="${y}" r="62" fill="url(#kf)"/><rect x="${x-17}" y="${y-7}" width="34" height="14" rx="2" fill="#eef6ff"/>`});
  s+='<path d="M0 206 L360 206 L360 252 L0 252 Z" fill="#0a1622"/>';
  for(let i=0;i<72;i++) s+=`<circle cx="${4+i*5}" cy="${214+(i*7%6)*6}" r="2.2" fill="${['#00B140','#fff','#046A38','#9fb3a6','#00B140','#5B2A86'][i%6]}" opacity=".5"/>`;
  s+='<rect x="0" y="250" width="360" height="270" fill="url(#kg)"/>';
  for(let i=1;i<7;i++){const y=250+i*i*6.4; s+=`<line x1="0" y1="${y}" x2="360" y2="${y}" stroke="#fff" stroke-width="${.7+i*.35}" opacity=".26"/>`}
  s+=`<path d="M${cx-hw} ${cy-alto} V${cy} H${cx+hw} V${cy-alto} M${cx} ${cy} V256" stroke="#FFD028" stroke-width="${Math.max(3,hw/7)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  let bx=cx, by=y0, sc=1, rot=-16;
  if(res){
    const corto=res.tipo==='corto';
    const tx=cx+res.off*hw, ty=corto?cy+30:cy-alto*.5;
    const e=1-Math.pow(1-u,1.6);
    bx=cx+(tx-cx)*e; by=y0+(ty-y0)*e-Math.sin(Math.PI*u)*(corto?60:95)*(1-u*.4);
    sc=1-.8*e; rot=-16+u*900;
  }
  s+=`<ellipse cx="${cx}" cy="${y0+20}" rx="${17*(res?Math.max(.2,1-u):1)}" ry="5" fill="#000" opacity="${res?.28*(1-u):.32}"/>`;
  s+=`<g transform="translate(${bx} ${by}) rotate(${rot}) scale(${sc})"><ellipse rx="12.5" ry="20" fill="#8B4A1F" stroke="#3d1f0b" stroke-width="1.6"/><path d="M0 -10 V10 M-3.5 -6 H3.5 M-3.5 0 H3.5 M-3.5 6 H3.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></g>`;
  $('#kscene').innerHTML=s;
}
function finChut(){
  const r=K.res, bueno=r.tipo==='bueno'; K.fase='res';
  S.kick.n++; $('#kbtn').disabled=false;
  const txt={bueno:'¡BUENO! 🙌',corto:'Corto: faltó pierna',poste:'¡DOINK! Al poste…',fuera:r.off<0?'Se fue a la izquierda':'Se fue a la derecha'}[r.tipo];
  $('#kmsg').textContent=txt;
  if(r.tipo==='poste')SND.doink(); else if(bueno)SND.td(); else SND.ko();
  if(K.modo==='pat'){
    if(bueno){S.kick.ok++;S.kick.pat++;sumar(10);burst(true);$('#kmsg').textContent='¡BUENO! +10 yardas 🙌'}
    save();
    $('#kbtn').textContent='Continuar'; $('#kbtn').className='b b-verde'; $('#kbtn').onclick=closeKick;
    if(!bueno){$('#kbtn2').style.display='block';$('#kbtn2').textContent='Repetir el chut';$('#kbtn2').onclick=nuevoChut}
    return;
  }
  if(bueno){
    S.kick.ok++; K.hechos++; K.mejor=Math.max(K.mejor,K.dist); sumar(5);
    const rec=K.dist>S.kick.rec; if(rec)S.kick.rec=K.dist;
    burst(K.dist>=54);
    $('#kmsg').textContent=K.dist===54?'¡54 YARDAS! Como el 41 🙌':rec?`¡BUENO! Nuevo récord: ${K.dist} yardas`:'¡BUENO! 🙌';
    if(K.idx>=KDIST.length-1){ $('#kmsg').textContent='¡70 YARDAS! No queda campo 🚀'; finArcade(); return; }
    K.idx++; save();
    $('#kbtn').textContent=`Siguiente: ${KDIST[K.idx]} yardas`; $('#kbtn').className='b b-verde'; $('#kbtn').onclick=nuevoChut;
  } else {
    K.fallos++; save();
    $('#klives').innerHTML=[0,1,2].map(i=>i<3-K.fallos?'🏈':'<span style="opacity:.25">🏈</span>').join('');
    if(K.fallos>=3){finArcade();return}
    $('#kbtn').textContent='Otra vez desde aquí'; $('#kbtn').className='b b-ambar'; $('#kbtn').onclick=nuevoChut;
  }
}
function finArcade(){
  chkInsig(); save();
  $('#kmsg').textContent=K.mejor?`Fin: tu chut más largo, ${K.mejor} yardas${K.mejor>=54?' 🎯':''}`:'Fin: hoy no ha entrado ninguno';
  $('#kbtn').textContent='Jugar otra vez'; $('#kbtn').className='b b-verde'; $('#kbtn').onclick=()=>{const m=K.modo;openKick(m)};
  $('#kbtn2').style.display='block'; $('#kbtn2').textContent='Salir'; $('#kbtn2').onclick=closeKick;
}

/* ================= CONFETI ================= */
const CV=$('#confetti'), CX=CV.getContext('2d'); let P=[], RUN=false;
function burst(big){
  const W=CV.width=innerWidth, H=CV.height=innerHeight, n=big?130:50;
  const cols=['#00B140','#FFFFFF','#FFD028','#046A38','#2E9BFF','#FF4757'];
  for(let i=0;i<n;i++)P.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:Math.random()*7+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1});
  if(!RUN){RUN=true;requestAnimationFrame(loopC)}
}
function loopC(){
  CX.clearRect(0,0,CV.width,CV.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.vx*=.99;p.r+=p.vr;p.l-=.011;
    CX.save();CX.globalAlpha=Math.max(0,p.l);CX.translate(p.x,p.y);CX.rotate(p.r);CX.fillStyle=p.c;CX.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);CX.restore()});
  P=P.filter(p=>p.l>0&&p.y<CV.height+30);
  if(P.length)requestAnimationFrame(loopC); else{RUN=false;CX.clearRect(0,0,CV.width,CV.height)}
}

/* ================= ARRANQUE ================= */
if(S.hoyDia!==hoy()){S.hoyDia=hoy();S.hoyYd=0}
if(S.ult&&S.ult!==hoy()&&S.ult!==ayer())S.racha=0;      // la racha se rompe si faltó un día entero
render();
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>{const p=PARTIDOS.find(x=>x.id===el.dataset.cd);if(p)el.outerHTML=cuentaAtras(p)})},30000);

</script>
